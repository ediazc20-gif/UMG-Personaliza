<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago — UMG Personaliza</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/umg-glass.css?v=20261023roundednav" />
</head>
<body class="umg-app umg-app--task">
  <div class="umg-mesh" aria-hidden="true">
    <div class="umg-mesh__blob umg-mesh__blob--1"></div>
    <div class="umg-mesh__blob umg-mesh__blob--2"></div>
  </div>
  <div class="umg-shell">
    <div class="page-wrap" style="max-width:520px;margin:0 auto;padding-top:48px;">
      <div class="glass-card glass-card--pad" id="panel">
        <p class="page-kicker">Pago con tarjeta</p>
        <h1 class="display-title" style="font-size:1.75rem">Confirmando tu <em>pago</em></h1>
        <p class="lead" id="statusText">Estamos validando tu pago…</p>
        <div id="msg" class="msg-glass msg-glass--pending" role="status" aria-live="polite">
          <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
          Conectando con Recurrente, un momento…
        </div>
        <p style="margin-top:20px;font-size:0.85rem;color:var(--ink-mute)">
          Tarjeta de prueba (sandbox): <strong>4242 4242 4242 4242</strong>, fecha futura, CVC de 3 dígitos.
        </p>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    (async () => {
      if (!localStorage.getItem('uid')) {
        location.replace('/');
        return;
      }
      const params = new URLSearchParams(location.search);
      const codigo = params.get('codigo') || '';
      const checkoutId = params.get('checkout_id') || params.get('checkoutId') || params.get('id') || '';
      const statusText = document.getElementById('statusText');
      const msg = document.getElementById('msg');
      const showStatus = (iconClass, text) => {
        const icon = document.createElement('i');
        icon.className = iconClass;
        icon.setAttribute('aria-hidden', 'true');
        msg.replaceChildren(icon, document.createTextNode(` ${String(text ?? '')}`));
      };

      if (!codigo) {
        statusText.textContent = 'Falta el código de orden en la URL.';
        return;
      }

      try {
        const qs = new URLSearchParams({ codigo });
        if (checkoutId) qs.set('checkout_id', checkoutId);
        const data = await apiFetch(`/api/tienda/pago/recurrente/verificar?${qs}`);
        if (data.pagado) {
          statusText.textContent = `Pago confirmado — orden ${data.orden.codigo}`;
          msg.className = 'msg-glass msg-glass--ok';
          showStatus('fas fa-circle-check', '¡Listo! Redirigiendo al rastreo…');
          setTimeout(() => {
            location.href = `/comprador/tracking.html?codigo=${encodeURIComponent(data.orden.codigo)}`;
          }, 2800);
        } else {
          statusText.textContent = data.message || 'Pago pendiente';
          msg.className = 'msg-glass msg-glass--error';
          showStatus('fas fa-circle-exclamation', data.message || 'Aún no vemos el pago.');
          msg.insertAdjacentHTML('afterend', `<p style="margin-top:12px"><a class="btn-ghost-glass" href="/comprador/tracking.html?codigo=${encodeURIComponent(codigo)}">Ver estado de la orden</a></p>`);
        }
      } catch (err) {
        statusText.textContent = 'No se pudo verificar el pago';
        msg.className = 'msg-glass msg-glass--error';
        showStatus('fas fa-circle-exclamation', err.message || 'Error inesperado.');
      }
    })();
  </script>
</body>
</html>
