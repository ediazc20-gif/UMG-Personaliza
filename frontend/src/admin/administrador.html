<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UMG Personaliza — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/umg-glass.css?v=20260828k" />
  <link rel="stylesheet" href="/admin/css/admin.css?v=20260828m" />
  <link rel="stylesheet" href="/css/umg-admin-glass.css?v=20260828m" />
  <script defer src="/js/api.js"></script>
  <script defer src="/js/panel-ws.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    (function() {
      var uid = localStorage.getItem('uid');
      var rol = (localStorage.getItem('rol') || '').toUpperCase();
      if (!uid) {
        window.location.replace('/');
      } else if (rol !== 'ADMIN' && rol !== 'ADMINISTRADOR') {
        window.location.replace('/');
      }
    })();
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        var uid = localStorage.getItem('uid');
        var rol = (localStorage.getItem('rol') || '').toUpperCase();
        if (!uid || (rol !== 'ADMIN' && rol !== 'ADMINISTRADOR')) {
          window.location.replace('/');
        }
      }
    });
  </script>
  <script defer src="/admin/js/admin.js?v=20260830c"></script>
</head>
<body class="umg-app admin-glass umg-app--task">
  <div class="umg-mesh" aria-hidden="true">
    <div class="umg-mesh__blob umg-mesh__blob--1"></div>
    <div class="umg-mesh__blob umg-mesh__blob--2"></div>
    <div class="umg-mesh__blob umg-mesh__blob--3"></div>
  </div>

  <div id="wrapper">
    <button type="button" id="btnSidebarToggle" class="admin-menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <div id="sidebarBackdrop" class="admin-sidebar-backdrop" hidden></div>

    <div id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="glass-nav__mark"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
          UMG Personaliza
        </div>
        <div class="sidebar-header-actions">
          <span class="role-badge role-badge-admin">Admin</span>
          <button type="button" id="btnSidebarClose" class="admin-sidebar-close" aria-label="Cerrar menu">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div>
          <div class="sidebar-username" id="sidebarUsername">Administrador</div>
          <div class="sidebar-role">Administrador del sistema</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">Gestion</div>
        <a class="nav-link active" href="#" data-section="usuarios"><i class="fa-solid fa-users"></i> Usuarios</a>
        <a class="nav-link" href="#" data-section="roles"><i class="fa-solid fa-layer-group"></i> Roles</a>
        <a class="nav-link" href="#" data-section="auditoria"><i class="fa-solid fa-clock-rotate-left"></i> Auditoria</a>
        <a class="nav-link" href="#" data-section="productos"><i class="fa-solid fa-box"></i> Productos tienda</a>
        <a class="nav-link" href="#" data-section="ordenes"><i class="fa-solid fa-receipt"></i> Ordenes tienda</a>
        <a class="nav-link" href="#" data-section="areas"><i class="fa-solid fa-location-dot"></i> Áreas de entrega</a>
        <a class="nav-link" href="#" data-section="whatsapp"><i class="fa-brands fa-whatsapp"></i> Notificaciones WhatsApp</a>
        <a class="nav-link" href="#" data-section="dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard ventas</a>
        <div class="nav-section">Cuenta</div>
        <a class="nav-link" href="#" data-section="perfil"><i class="fa-solid fa-id-card"></i> Perfil</a>
      </nav>

      <div class="sidebar-footer">
        <button id="btnLogout" class="btn-logout-sidebar" type="button">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesion
        </button>
      </div>
    </div>

    <div id="content">
      <div class="content-header">
        <div>
          <p class="page-kicker">Operaciones campus</p>
          <h2>Panel de <em>administracion</em></h2>
        </div>
        <span class="page-title">Admin / <span id="admin-nombre"></span></span>
      </div>
      <div class="content-body">
        <div id="section-container">
          <div class="empty-state">
            <p class="lead">Selecciona una opcion del menu lateral.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</body>
</html>
